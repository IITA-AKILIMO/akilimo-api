name: BuildLatestTag

on:
  workflow_call:
    inputs:
      dockerfile:
        required: true
        type: string
      image_name:
        required: true
        type: string
      specific_tag:
        required: false
        type: string
      force_rebuild:
        required: false
        type: boolean
        default: false
    secrets:
      docker_username:
        required: true
      docker_password:
        required: true

jobs:
  check-and-build-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      cancel-in-progress: true
      group: check-tag-${{ github.ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get latest tag
        if: inputs.specific_tag == ''
        uses: ./.github/actions/get-latest-tag
        id: latest-tag

      - name: Set final tag
        id: final-tag
        run: |
          TAG="${{ inputs.specific_tag != '' && inputs.specific_tag || steps.latest-tag.outputs.tag }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Check Docker image
        if: inputs.force_rebuild != true && steps.final-tag.outputs.tag != ''
        uses: ./.github/actions/check-docker-image
        id: check-image
        with:
          image_name: ${{ inputs.image_name }}
          tag: ${{ steps.final-tag.outputs.tag }}

      - name: Docker login
        if: steps.final-tag.outputs.tag != '' && (inputs.force_rebuild == true || steps.check-image.outputs.exists != 'true')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_password }}

      - name: Build and push
        if: steps.final-tag.outputs.tag != '' && (inputs.force_rebuild == true || steps.check-image.outputs.exists != 'true')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ${{ inputs.image_name }}:latest
            ${{ inputs.image_name }}:${{ steps.final-tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Rollback Release
        if: failure()
        uses: author/action-rollback@stable
        with:
          tag: ${{ steps.final-tag.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
