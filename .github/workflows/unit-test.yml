name: UnitTests

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

env:
  APP_ENV: testing
  APP_KEY: base64:Ny2n0WddJ9K1bJPlK4CkS5I0Wj9BbytcVYdRmqNP/5I=

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      cancel-in-progress: true
      group: unit-test-${{ github.ref }}

    services:
      mariadb:
        image: mariadb:11.2
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: akilimo_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: akilimo_test
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # ── Test-result cache ────────────────────────────────────────────────────
      # Keyed on the exact commit SHA. If this commit already passed tests on
      # any branch, all subsequent steps are skipped.
      - name: Restore test result cache
        id: test-cache
        uses: actions/cache/restore@v6
        with:
          path: .test-passed
          key: test-result-${{ github.sha }}

      # ── PHP setup ───────────────────────────────────────────────────────────
      - name: Set up PHP
        if: steps.test-cache.outputs.cache-hit != 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql,pdo_mysql,mbstring
          coverage: none

      # ── Composer vendor cache ────────────────────────────────────────────────
      - name: Restore composer cache
        if: steps.test-cache.outputs.cache-hit != 'true'
        id: composer-cache
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ runner.os }}-php8.4-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php8.4-

      - name: Install dependencies
        if: steps.test-cache.outputs.cache-hit != 'true' && steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install --no-progress --no-suggest --prefer-dist --no-scripts

      - name: Run composer scripts
        if: steps.test-cache.outputs.cache-hit != 'true'
        run: composer run-script post-autoload-dump

      # ── App bootstrap ────────────────────────────────────────────────────────
      - name: Copy .env
        if: steps.test-cache.outputs.cache-hit != 'true'
        run: cp .env.example .env

      - name: Generate app key
        if: steps.test-cache.outputs.cache-hit != 'true'
        run: php artisan key:generate --new

      # ── Frontend assets ──────────────────────────────────────────────────────
      - name: Set up pnpm
        if: steps.test-cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 11.27.0

      - name: Restore pnpm cache
        if: steps.test-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install Node dependencies
        if: steps.test-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build assets
        if: steps.test-cache.outputs.cache-hit != 'true'
        run: pnpm build

      # ── Tests ────────────────────────────────────────────────────────────────
      - name: Run tests
        if: steps.test-cache.outputs.cache-hit != 'true'
        run: composer run test

      # Save sentinel only after tests pass; failed runs produce no cache
      # entry so the next run will retry rather than skip.
      - name: Create test sentinel
        if: steps.test-cache.outputs.cache-hit != 'true' && success()
        run: echo "passed at $(date -u)" > .test-passed

      - name: Save test result cache
        if: steps.test-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v6
        with:
          path: .test-passed
          key: test-result-${{ github.sha }}
