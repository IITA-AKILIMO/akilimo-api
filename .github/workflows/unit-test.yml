name: UnitTests

# The tests need MariaDB (database views and generated columns), not SQLite. No Node build is needed: the tests stand in for
# Vite (tests/TestCase.php), so they run without public/build.
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Runs of the same kind on one branch replace each other. A push run and a pull-request run never do: the gate job below skips
# the push run when a pull request is open, because cancelling one of the two would leave a cancelled check on the pull request
concurrency:
  group: unit-test-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  APP_ENV: testing
  # A throwaway key for tests only; phpunit.xml sets one as well
  APP_KEY: base64:Ny2n0WddJ9K1bJPlK4CkS5I0Wj9BbytcVYdRmqNP/5I=

jobs:
  # A push to a branch that has an open pull request is checked by the pull request's own run, so the push run is skipped here.
  # Without this, the push run and the pull-request run check the same commit, one of them is cancelled, and GitHub shows a
  # cancelled (not passing) check on the pull request. Pushes to branches without a pull request still run.
  gate:
    name: Decide whether to run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          run=true

          if [ "$EVENT" = "push" ]; then
            # An open pull request runs the same checks on this commit, so the push run would only duplicate it
            open="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq 'length' 2>/dev/null || echo 0)"
            if [ "${open:-0}" != "0" ]; then
              run=false
              echo "A pull request is open for $BRANCH, so its own run checks this commit. This push run is skipped." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          echo "run=$run" >> "$GITHUB_OUTPUT"

  test:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      mariadb:
        image: mariadb:11.2
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: akilimo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: akilimo
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP and install dependencies
        uses: ./.github/actions/php-setup

      # Laravel loads the committed MariaDB schema dump with the client program
      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Prepare environment file
        run: cp .env.example .env

      # The tests migrate the database themselves (RefreshDatabase), so there is no separate migrate step here
      - name: Check code style
        run: composer run lint:check

      # test:ci is plain Pest. `composer test` adds --bail, which stops at the first failure and hides the others
      - name: Run tests
        run: |
          mkdir -p test-results
          composer run test:ci -- --log-junit=test-results/junit.xml

      - name: Summarise the test results
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          import xml.etree.ElementTree as ET

          path = "test-results/junit.xml"
          if not os.path.exists(path):
              print("## Tests\n\nNo test report was written (the run stopped before the tests finished).")
              raise SystemExit

          root = ET.parse(path).getroot()
          cases = list(root.iter("testcase"))
          failed = [c for c in cases if c.find("failure") is not None or c.find("error") is not None]
          skipped = [c for c in cases if c.find("skipped") is not None]
          print(f"## Tests\n\n{len(cases)} run, {len(failed)} failed, {len(skipped)} skipped.\n")
          for case in failed[:30]:
              print(f"- `{case.get('classname', '')}::{case.get('name', '')}`")
          if len(failed) > 30:
              print(f"- ... and {len(failed) - 30} more")
          PY

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      # Information, not a gate: an advisory in a package we cannot fix today must not stop every build
      - name: Check dependencies for known vulnerabilities
        if: always()
        continue-on-error: true
        run: composer audit --no-dev
