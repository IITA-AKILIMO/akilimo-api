name: BumpVersion
on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  bump-tag-version:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    concurrency:
      cancel-in-progress: true
      group: bump-version-${{ github.ref }}
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}


      - name: Generate Tag
        id: tag_version
        uses: masgeek/github-tag-action@4
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          tag_prefix: ""
          create_annotated_tag: true
          default_bump: "false"        # nothing releasable (docs/ci/chore only) → no tag
          default_prerelease_bump: "false" # nothing releasable (docs/ci/chore only) → no tag
          gitmoji: true                # understand ✨ feat(x): … and 💥 breaking commits
          extended_release_rules: true # also: accessibility/removal → minor; security/refactor/build → patch
          fetch_all_tags: true
          create_release: true         # GitHub Release with the changelog as its body



      - name: Create a GitHub release
        uses: ncipollo/release-action@v1.21.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Version ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          makeLatest: true
          allowUpdates: true
          generateReleaseNotes: true
          skipIfReleaseExists: false

  check-and-build:
    needs: bump-tag-version
    if: needs.bump-tag-version.result == 'success'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/check-tag-job.yml
    with:
      dockerfile: Dockerfile
      image_name: ghcr.io/iita-akilimo/akilimo-api
      specific_tag: ${{ needs.bump-tag-version.outputs.new_tag }}
      force_rebuild: true
