name: DockerBuild

on:
  # Trigger only after unit tests complete successfully on the target branches.
  # This replaces the direct push trigger — the build cannot start unless tests pass.
  workflow_run:
    workflows: ["UnitTests"]
    types: [completed]
    branches:
      - main
      - develop
      - 'beta/**'
  workflow_dispatch:

jobs:
  docker:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/docker-build-job.yml
    with:
      dockerfile: Dockerfile
      image_name: iita/akilimo-api
    secrets:
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      docker_password: ${{ secrets.DOCKER_PASSWORD }}
