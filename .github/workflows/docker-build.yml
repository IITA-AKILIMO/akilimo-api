name: Build Application Image

on:
  workflow_run:
    workflows: ["UnitTests"]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: akilimo-api-${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set Docker tags
        id: docker_tags
        uses: ./.github/actions/set-docker-tags
        with:
          image_name: ghcr.io/iita-akilimo/akilimo-api
          ref: refs/heads/${{ github.event.workflow_run.head_branch }}
          ref_name: ${{ github.event.workflow_run.head_branch }}

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            BASE_IMAGE=ghcr.io/${{ vars.BASE_IMAGE || 'masgeek/laravel-frankenphp-base:php8.4' }}
            APP_BASE_PATH=${{ vars.APP_BASE_PATH || '/var/www/html/fuelrod' }}
          tags: ${{ steps.docker_tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Deploy to Dokploy
        uses: ./.github/actions/dokploy-deploy
        with:
          n8n_webhook_token: ${{ secrets.N8N_WEBHOOK_TOKEN }}
          n8n_webhook_url: ${{ vars.N8N_WEBHOOK }}
          compose_id: ${{ vars.DOKPLOY_COMPOSE_ID }}
          image_name: ghcr.io/iita-akilimo/akilimo-api
