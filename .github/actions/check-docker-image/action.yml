name: Check Docker Image
description: Check if Docker image tag exists

inputs:
  image_name:
    required: true
    description: Docker image name
  tag:
    required: true
    description: Docker image tag
  username:
    required: true
    description: Docker username
  password:
    required: true
    description: Docker password
  registry:
    required: false
    default: ghcr.io
    description: Container registry

outputs:
  exists:
    description: Whether the image exists
    value: ${{ steps.check.outputs.exists }}

runs:
  using: composite
  steps:
    - id: check
      shell: bash
      run: |
        echo "${{ inputs.password }}" | docker login "${{ inputs.registry }}" \
          -u "${{ inputs.username }}" --password-stdin

        if docker manifest inspect "${{ inputs.image_name }}:${{ inputs.tag }}" > /dev/null 2>&1; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi
