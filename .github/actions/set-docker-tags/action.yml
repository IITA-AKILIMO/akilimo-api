name: Set Docker Tags
description: Set Docker image tags based on git ref

inputs:
  image_name:
    required: true
    description: Base image name
  ref:
    required: true
    description: Git ref
  ref_name:
    required: true
    description: Git ref name

outputs:
  tags:
    description: Generated Docker tags
    value: ${{ steps.set_tags.outputs.tags }}

runs:
  using: composite
  steps:
    - id: set_tags
      shell: bash
      run: |
        # Reserve the `latest` tag for main-branch builds only. Every other
        # environment gets its own stable tag and never shadows `latest`.
        if [[ "${{ inputs.ref }}" == refs/tags/* ]]; then
          # For version tags, publish the version tag only.
          VERSION="${{ inputs.ref_name }}"
          TAGS="${{ inputs.image_name }}:${VERSION}"
        elif [[ "${{ inputs.ref }}" == "refs/heads/main" ]]; then
          # Main builds are the production image and own the `latest` tag.
          TAGS="${{ inputs.image_name }}:latest,${{ inputs.image_name }}:production"
        elif [[ "${{ inputs.ref }}" == "refs/heads/develop" ]]; then
          # Develop builds publish the stable `develop` tag.
          TAGS="${{ inputs.image_name }}:develop"
        else
          # Feature branches get a sanitized branch-name tag.
          SAFE_REF_NAME=$(echo "${{ inputs.ref_name }}" | sed 's/[\/]/-/g')
          TAGS="${{ inputs.image_name }}:${SAFE_REF_NAME}"
        fi

        echo "tags=$TAGS" >> $GITHUB_OUTPUT
