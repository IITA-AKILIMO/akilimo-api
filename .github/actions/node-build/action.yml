name: Node build
description: Install the Node dependencies with pnpm and build the front-end assets

inputs:
  pnpm-version:
    description: pnpm version
    required: false
    default: '11.27.0'

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v6
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Restore the pnpm cache
      uses: actions/cache@v6
      with:
        path: ~/.local/share/pnpm/store
        key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-${{ runner.os }}-

    - name: Install Node dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Build assets
      shell: bash
      run: pnpm build
