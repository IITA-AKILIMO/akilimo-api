name: "akilimo-new"

services:
    api:
        image: ghcr.io/iita-akilimo/akilimo-api:${AKILIMO_TAG:-latest}
        container_name: api
        restart: unless-stopped
        build:
            context: .
            dockerfile: Dockerfile
            args:
                BASE_IMAGE: "${BASE_IMAGE:-ghcr.io/masgeek/laravel-frankenphp-base:php8.4}"
                APP_BASE_PATH: "${APP_BASE_PATH:-/var/www/html/fuelrod}"
        env_file:
            - .env
        environment:
            # App
            APP_NAME: ${APP_NAME:-Akilimo}
            APP_ENV: ${APP_ENV:-production}
            APP_KEY: ${APP_KEY}
            APP_DEBUG: ${APP_DEBUG:-false}
            APP_URL: ${APP_URL:-http://localhost}
            APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
            LOG_CHANNEL: ${LOG_CHANNEL:-stack}
            LOG_LEVEL: ${LOG_LEVEL:-error}
            # Database
            DB_CONNECTION: ${DB_CONNECTION:-mariadb}
            DB_HOST: ${DB_HOST:-mariadb}
            DB_PORT: ${DB_PORT:-3306}
            DB_DATABASE: ${DB_DATABASE}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
            # Cache / Redis
            REDIS_HOST: cache-dev
            HORIZON_ENABLED: "${HORIZON_ENABLED:-false}"
            SCHEDULER_ENABLED: "${SCHEDULER_ENABLED:-false}"
            LARAVEL_MIGRATE: "${LARAVEL_MIGRATE:-false}"
            LARAVEL_OPTIMIZE: "${LARAVEL_OPTIMIZE:-false}"
        ports:
            - "127.0.0.1:9100:80"
        init: true
        stop_grace_period: 2m
        networks:
            - dokploy-network
            - internal

networks:
    internal:
        name: internal
        external: true
    dokploy-network:
        name: dokploy-network
        external: true
